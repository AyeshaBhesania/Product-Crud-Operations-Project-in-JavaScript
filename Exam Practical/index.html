<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom Kitchen — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="page--home">

<div class="blobs" aria-hidden="true">
  <span class="blob blob--a"></span>
  <span class="blob blob--b"></span>
  <span class="blob blob--c"></span>
</div>


<header class="site-header">
  <a href="index.html" class="brand">
    <span class="brand__mark"><img src="images/fast-food.png" alt=""></span>
    <span class="brand__text">
      <span class="brand__name">Food Mania</span>
      <span class="brand__tag">Delicious food, made daily</span>
    </span>
  </a>

  <nav class="site-nav">
    <a href="form.html" class="btn btn--add">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Add a dish
    </a>
  </nav>
</header>


<section class="hero">
  <h1 class="hero__title">What's cooking today?</h1>
  <p class="hero__sub">Browse the full menu, search for a favorite, or filter by category.</p>
</section>


<main class="main">

  <div class="toolbar">
    <div class="toolbar__search">
      <svg width="17" height="17" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5.3" stroke="currentColor" stroke-width="1.5"/><path d="M11 11L14.2 14.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input type="text" id="searchInput" placeholder="Search dishes…" autocomplete="off">
    </div>

    <select id="categoryFilter" class="toolbar__select" aria-label="Filter by category">
      <option value="all">All categories</option>
    </select>

    <select id="sortSelect" class="toolbar__select" aria-label="Sort by price">
      <option value="none">Sort: featured</option>
      <option value="asc">Price: low to high</option>
      <option value="desc">Price: high to low</option>
    </select>
  </div>

  <p class="result-count" id="resultCount">0 dishes</p>

  <div id="productGrid" class="grid"></div>

  <div id="emptyState" class="empty" hidden>
    <span class="empty__emoji">🍽️</span>
    <p class="empty__title">Nothing here yet</p>
    <p class="empty__sub">Add your first dish to get the menu started.</p>
    <a href="form.html" class="btn btn--add">Add a dish</a>
  </div>
</main>

<script src="js/storage.js"></script>
<script src="js/home.js"></script>
</body>
</html>
